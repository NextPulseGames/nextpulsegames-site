name: Validate rebuilt site once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-site-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run HTML and asset checks
        run: python tests/check_site.py
      - name: Run JavaScript checks
        run: node tests/check_script.cjs
