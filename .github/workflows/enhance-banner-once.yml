name: Enhance NextPulse banner once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enhance-banner-once.yml"

permissions:
  contents: write

jobs:
  enhance-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate sharper responsive banner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          import re

          src = Path("assets/brand/nextpulse-20261027-768.webp")
          image = Image.open(src).convert("RGB")

          for width in (1024, 1536, 2048):
              height = round(width * 9 / 16)
              out = image.resize((width, height), Image.Resampling.LANCZOS)
              out = ImageEnhance.Color(out).enhance(1.10)
              out = ImageEnhance.Contrast(out).enhance(1.07)
              out = ImageEnhance.Sharpness(out).enhance(1.20)
              out = out.filter(ImageFilter.UnsharpMask(radius=1.4, percent=145, threshold=2))
              out.save(
                  f"assets/brand/nextpulse-20261027-{width}.webp",
                  "WEBP",
                  quality=92,
                  method=6,
              )

          for filename in ("index.html", "pl/index.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              pattern = re.compile(
                  r'(<div class="hero-brand-visual"><img alt="[^"]*" decoding="async" fetchpriority="high")'
                  r'[^>]*'
                  r'(/></div>)'
              )
              replacement = (
                  r'\1 height="1152" sizes="100vw" '
                  r'src="/assets/brand/nextpulse-20261027-1536.webp?v=20261027-2" '
                  r'srcset="/assets/brand/nextpulse-20261027-1024.webp?v=20261027-2 1024w, '
                  r'/assets/brand/nextpulse-20261027-1536.webp?v=20261027-2 1536w, '
                  r'/assets/brand/nextpulse-20261027-2048.webp?v=20261027-2 2048w" '
                  r'width="2048"\2'
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"Could not update hero image in {filename}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit improved banner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/nextpulse-20261027-1024.webp \
                  assets/brand/nextpulse-20261027-1536.webp \
                  assets/brand/nextpulse-20261027-2048.webp \
                  index.html pl/index.html
          git commit -m "Enhance NextPulse hero banner quality"
          git push
